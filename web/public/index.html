<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NiZZLE Family — Mots Fléchés Foot</title>
<link rel="stylesheet" href="style.css?v=10">
</head>
<body>
<div class="rail rail-gauche" aria-hidden="true"></div>
<div class="rail rail-droite" aria-hidden="true"></div>
<div class="plateau">
  <header class="bandeau">
    <h1 class="logo">NiZZLE<span class="logo-family">Family</span>
      <span class="logo-foot">MOTS FLÉCHÉS FOOT</span></h1>
    <div class="bandeau-champs">
      <span class="champ"><b>LE :</b> <span id="date-jour" class="pointille"></span></span>
      <button id="btn-jour" class="bouton-sens">⭐ Grille du jour</button>
      <button id="btn-catalogue" class="bouton-sens">Catalogue</button>
      <button id="sens" class="bouton-sens" title="Sens de saisie (clic sur la case sélectionnée pour basculer)">
        Saisie : <span id="sens-libelle">→ horizontal</span>
      </button>
      <button id="verifier" class="bouton-sens" title="Surligner les lettres fausses">
        Vérifier
      </button>
      <button id="indice" class="bouton-sens" title="Révéler la lettre de la case sélectionnée">
        Indice
      </button>
      <button id="solutions" class="bouton-sens" title="Afficher ou masquer la grille finalisée">
        Solutions
      </button>
    </div>
  </header>
  <div id="sous-titre" class="sous-titre"></div>
  <div id="bandeau-etat" class="bandeau-etat" hidden></div>
  <main>
    <div id="grille" class="grille" tabindex="0" aria-label="Grille de mots fléchés"></div>
  </main>
  <div id="catalogue" class="catalogue-fond" hidden>
    <div class="catalogue-panneau">
      <div class="catalogue-tete">
        <h2>Catalogue des grilles</h2>
        <button id="catalogue-fermer" class="bouton-sens">Fermer</button>
      </div>
      <div id="catalogue-contenu"></div>
    </div>
  </div>
  <div id="victoire" class="catalogue-fond" hidden>
    <div class="victoire-panneau">
      <div class="victoire-titre">🎉 Bravo !</div>
      <p id="victoire-message">Grille terminée sans faute.</p>
      <p class="victoire-note">Valide-la pour la marquer ✓ en vert dans le
        catalogue — tu sauras qu'elle est faite.</p>
      <div class="victoire-boutons">
        <button id="victoire-valider" class="bouton-sens actif">Valider la grille ✓</button>
        <button id="victoire-plus-tard" class="bouton-sens">Plus tard</button>
      </div>
    </div>
  </div>
  <input id="clavier-mobile" type="text" inputmode="text" autocomplete="off"
         autocorrect="off" autocapitalize="characters" spellcheck="false"
         aria-hidden="true" tabindex="-1">
  <footer class="pied">NiZZLE Family — un jeu maison, thème football</footer>
</div>
<script type="module" src="app.js?v=10"></script>
</body>
</html>
