<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NiZZLE Family — Mots Fléchés Foot</title>
<link rel="stylesheet" href="style.css?v=2">
</head>
<body>
<div class="rail rail-gauche" aria-hidden="true"></div>
<div class="rail rail-droite" aria-hidden="true"></div>
<div class="plateau">
  <header class="bandeau">
    <h1 class="logo">NiZZLE<span class="logo-family">Family</span>
      <span class="logo-foot">MOTS FLÉCHÉS FOOT</span></h1>
    <div class="bandeau-champs">
      <span class="champ"><b>LE :</b> <span id="date-jour" class="pointille"></span></span>
      <span class="champ"><b>GRILLE :</b>
        <select id="choix-grille" aria-label="Choisir une grille"></select>
      </span>
      <button id="sens" class="bouton-sens" title="Sens de saisie (clic sur la case sélectionnée pour basculer)">
        Saisie : <span id="sens-libelle">→ horizontal</span>
      </button>
      <button id="solutions" class="bouton-sens" title="Afficher ou masquer la grille finalisée">
        Solutions
      </button>
    </div>
  </header>
  <main>
    <div id="grille" class="grille" tabindex="0" aria-label="Grille de mots fléchés"></div>
  </main>
  <footer class="pied">NiZZLE Family — un jeu maison, thème football</footer>
</div>
<script type="module" src="app.js?v=2"></script>
</body>
</html>
